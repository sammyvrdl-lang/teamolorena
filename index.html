<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para você</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #FBEAF0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #72243E;
    margin: 0 0 20px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 0 auto 20px;
  }
  #status {
    text-align: center;
    font-size: 15px;
    color: #993556;
    margin-bottom: 16px;
  }
  #win {
    display: none;
    text-align: center;
    padding: 24px 16px;
    border: 1px solid #993556;
    border-radius: 16px;
    background: #FBEAF0;
  }
  #win i { font-size: 32px; color: #72243E; }
  #win p { font-size: 20px; font-weight: 600; color: #72243E; margin: 10px 0 0; }
  .mem-card { position: relative; aspect-ratio: 1/1; cursor: pointer; perspective: 600px; }
  .mem-card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s; transform-style: preserve-3d;
  }
  .mem-card.flipped .mem-card-inner { transform: rotateY(180deg); }
  .mem-face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; backface-visibility: hidden;
    border: 1px solid #993556; padding: 6px; text-align: center;
  }
  .mem-back { background: #F4C0D1; }
  .mem-front {
    background: #FBEAF0; transform: rotateY(180deg);
    flex-direction: column; gap: 4px;
  }
  .mem-front span { font-size: 11px; font-weight: 600; color: #72243E; line-height: 1.3; }
</style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-heart"></i> pra você <i class="ti ti-heart"></i></h1>
  <div id="grid"></div>
  <div id="status">Pares encontrados: 0 / 6</div>
  <div id="win">
    <i class="ti ti-heart"></i>
    <p>Eu te amo para sempre de verdade</p>
  </div>
</div>
<script>
(function(){
  var phrases = [
    'eu te amo para sempre',
    'sinto saudade ate quando durmo',
    'seus olhos iluminam meus dias',
    'sua risada ecoa como um delirio',
    'vc tem uma bunda deliciosa',
    'e eu te amo para sempre de verdade'
  ];
  var total = phrases.length;
  var ids = [];
  for (var i = 0; i < total; i++) { ids.push(i); ids.push(i); }
  for (var i = ids.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  }
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var winEl = document.getElementById('win');
  var flipped = [];
  var matched = 0;
  var lock = false;

  ids.forEach(function(pairId, idx){
    var card = document.createElement('div');
    card.className = 'mem-card';
    card.dataset.idx = idx;
    card.innerHTML =
      '<div class="mem-card-inner">' +
        '<div class="mem-face mem-back"><i class="ti ti-heart" style="font-size:22px;color:#993556;"></i></div>' +
        '<div class="mem-face mem-front"><i class="ti ti-heart" style="font-size:16px;color:#72243E;"></i><span>' + phrases[pairId] + '</span></div>' +
      '</div>';
    card.addEventListener('click', function(){
      if (lock) return;
      if (card.classList.contains('flipped')) return;
      if (flipped.length === 2) return;
      card.classList.add('flipped');
      flipped.push(card);
      if (flipped.length === 2) {
        lock = true;
        var a = flipped[0], b = flipped[1];
        var aId = ids[parseInt(a.dataset.idx)];
        var bId = ids[parseInt(b.dataset.idx)];
        if (aId === bId) {
          matched++;
          statusEl.textContent = 'Pares encontrados: ' + matched + ' / ' + total;
          setTimeout(function(){
            flipped = [];
            lock = false;
            if (matched === total) {
              winEl.style.display = 'block';
            }
          }, 500);
        } else {
          setTimeout(function(){
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            flipped = [];
            lock = false;
          }, 800);
        }
      }
    });
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
